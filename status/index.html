<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiteLLM Usage</title>
    <style>
      html,
      body {
        margin: 0;
      }
      #root {
        padding: 8px 10px;
        font: inherit;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .llu-line,
      .llu-provider,
      .llu-headline,
      .llu-hint,
      .llu-error,
      .llu-row {
        margin: 0;
      }
      .llu-provider {
        font-weight: 600;
      }
      .llu-headline {
        font-variant-numeric: tabular-nums;
      }
      .llu-hint {
        opacity: 0.7;
        font-size: 0.85em;
      }
      .llu-error {
        color: var(--oc-error-text, #d9534f);
      }
      .llu-rolling summary {
        cursor: pointer;
        opacity: 0.8;
        font-size: 0.9em;
      }
      .llu-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding-left: 12px;
        font-variant-numeric: tabular-nums;
      }
      .llu-retry {
        align-self: flex-start;
        margin-top: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
