<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiteLLM Usage</title>
    <style>
      html,
      body {
        margin: 0;
      }
      #root {
        padding: 0;
        display: flex;
        flex-direction: column;
        font-family: inherit;
        font-size: 13px;
        line-height: 1.5;
      }
      .llu-line,
      .llu-hint,
      .llu-error,
      .llu-row,
      .llu-retry {
        margin: 0;
      }
      /* The host already wraps this frame in `mx-1`; a row needs no second
         inset to line up with the native Work Status rows and header. */
      .llu-row {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0;
        border-radius: 6px;
        color: var(--oc-muted);
        text-align: start;
      }
      .llu-label {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .llu-detail {
        font-size: 11px;
      }
      .llu-value {
        flex: 0 0 auto;
        font-variant-numeric: tabular-nums;
      }
      /* The same status tokens the native Work Status values use. */
      .llu-value[data-tone='warning'] {
        color: var(--status-warning, var(--oc-warning, #b45309));
      }
      .llu-value[data-tone='error'] {
        color: var(--status-error, var(--oc-error, #d9534f));
      }
      .llu-line,
      .llu-hint,
      .llu-error {
        display: block;
        height: 28px;
        padding: 0;
        line-height: 28px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .llu-line {
        color: var(--oc-fg);
      }
      .llu-hint {
        color: var(--oc-muted);
      }
      .llu-error {
        color: var(--status-error, var(--oc-error, #d9534f));
      }
      .llu-retry {
        display: flex;
        align-items: center;
        height: 28px;
        padding: 0;
        border: none;
        background: none;
        font: inherit;
        color: var(--oc-muted);
        cursor: pointer;
      }
      .llu-retry:hover {
        color: var(--oc-fg);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
