<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiteLLM Usage</title>
    <style>
      html,
      body {
        margin: 0;
      }
      #root {
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-family: inherit;
        font-size: 13px;
        line-height: 1.5;
      }
      .llu-line,
      .llu-hint,
      .llu-error,
      .llu-row {
        margin: 0;
      }
      .llu-hint {
        color: var(--oc-muted);
      }
      .llu-error {
        color: var(--oc-error-text, #d9534f);
      }
      .llu-row {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        color: var(--oc-muted);
      }
      .llu-row > span:first-child {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .llu-row > span:last-child {
        flex: 0 0 auto;
        font-variant-numeric: tabular-nums;
      }
      .llu-toggle,
      .llu-retry {
        align-self: flex-start;
        margin-top: 2px;
        height: 28px;
        padding: 0 6px;
        border: none;
        border-radius: 6px;
        background: none;
        font: inherit;
        color: var(--oc-muted);
        cursor: pointer;
      }
      .llu-toggle:hover,
      .llu-retry:hover {
        color: var(--oc-fg);
      }
      .llu-retry {
        color: var(--oc-error-text, #d9534f);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
