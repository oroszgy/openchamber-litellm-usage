<!doctype html>
<!--
  PROTOTYPE — throwaway. Not the extension.

  Question (ticket #13): with the key, member and team budgets all rendered as
  rows, what should the LiteLLM Usage Work Status section look like inside its
  24..320 px height clamp — and what is the "tightest remaining" headline?

  Data mirrors a proposed /usage schema: a single `headline`
  (the least-remaining cap) plus `caps[]`, one per enforced budget:
    { source: 'key'|'member'|'team', duration, cap, spend, remaining,
      resetsAt, resetDerived, softBudget? }

  Three variants, switchable via ?variant= and the floating bottom bar (← / →):
    A  Ledger  — native flat rows, one per enforced budget (the chosen model)
    B  Meters  — one spend/cap progress meter per cap
    C  Tight   — headline-first; the other caps as compact pills

  Axes (top-left panel): theme, frame height (24..320), panel width, state,
  selector surface (header control vs in-panel select).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prototype — LiteLLM Usage section, multi-cap rows</title>
    <style>
      :root {
        --proto-bg: #f4f5f7;
        --proto-panel: #ffffff;
        --proto-text: #1b1e23;
        --proto-muted: #6b7280;
        --proto-sep: #e8eaee;
        --proto-accent: #2f6fed;
        --proto-danger: #c8443f;
        --proto-ctl-bg: #ffffff;
        --proto-ctl-border: #d3d8e0;
      }
      html[data-theme='dark'] {
        --proto-bg: #0e1014;
        --proto-panel: #171a21;
        --proto-text: #e7eaf0;
        --proto-muted: #9aa3b2;
        --proto-sep: #2a2f3a;
        --proto-accent: #6ea8fe;
        --proto-danger: #f2777a;
        --proto-ctl-bg: #0e1219;
        --proto-ctl-border: #2b3341;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--proto-bg);
        color: var(--proto-text);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 64px 24px 120px;
      }

      /* ---- mock Work Status panel (host chrome) ---- */
      .panel {
        background: var(--proto-panel);
        border: 1px solid var(--proto-sep);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        transition: width 0.12s ease;
      }
      .panel-title {
        padding: 10px 14px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--proto-muted);
        border-bottom: 1px solid var(--proto-sep);
      }
      .ws-section + .ws-section {
        border-top: 1px solid var(--proto-sep);
      }
      .ws-header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        min-height: 32px;
      }
      .ws-chevron {
        color: var(--proto-muted);
        font-size: 10px;
      }
      .ws-title {
        font-size: 12.5px;
        font-weight: 600;
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ws-inert .ws-body {
        padding: 2px 12px 12px;
        color: var(--proto-muted);
        font-size: 12px;
      }

      /* host-rendered header controls (faux setStatusControls) */
      .hdr-select,
      .hdr-btn {
        font: inherit;
        font-size: 11px;
        color: var(--proto-text);
        background: var(--proto-ctl-bg);
        border: 1px solid var(--proto-ctl-border);
        border-radius: 6px;
        height: 22px;
      }
      .hdr-select {
        max-width: 110px;
        padding: 0 4px;
      }
      .hdr-btn {
        width: 24px;
        cursor: pointer;
      }

      /* ---- the guest frame (this is the thing being designed) ---- */
      .frame {
        container: frame / size;
        position: relative;
        overflow: hidden;
        transition: height 0.1s ease;
      }
      .frame.bounds {
        outline: 1px dashed color-mix(in srgb, var(--proto-accent) 50%, transparent);
        outline-offset: -1px;
      }
      .frame-body {
        height: 100%;
        overflow: hidden;
      }
      .muted {
        color: var(--proto-muted);
      }
      .tnum {
        font-variant-numeric: tabular-nums;
      }

      /* ---- shared provider header ---- */
      .uhead {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px 4px;
      }
      .uhead .uicon {
        display: inline-flex;
        color: var(--proto-text);
      }
      .uhead .uname {
        font-size: 13.5px;
        font-weight: 600;
      }
      .uhead .uhead-val {
        margin-left: auto;
        font-weight: 600;
        white-space: nowrap;
      }
      .uhead .uhead-val.danger {
        color: var(--proto-danger);
      }

      /* ---------- variant A: ledger ---------- */
      .urow {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 4px 14px;
        font-size: 13px;
      }
      .urow .ulabel {
        white-space: nowrap;
      }
      .urow .umeta {
        color: var(--proto-muted);
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .urow .uval {
        margin-left: auto;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .urow .uval.danger {
        color: var(--proto-danger);
      }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--proto-danger);
        vertical-align: middle;
        margin-left: 4px;
      }
      .usublabel {
        padding: 6px 14px 2px;
        color: var(--proto-muted);
        font-size: 12px;
      }

      /* ---------- variant B: meters ---------- */
      .meterRow {
        padding: 6px 14px;
      }
      .meterRow .mtop {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 13px;
      }
      .meterRow .mtop .ulabel {
        white-space: nowrap;
      }
      .meterRow .mtop .uval {
        margin-left: auto;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .meterRow .uval.danger {
        color: var(--proto-danger);
      }
      .meterRow .mtrack {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
      }
      .meterRow .meter {
        flex: 1;
        height: 6px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--proto-sep) 90%, transparent);
        overflow: hidden;
      }
      .meterRow .meter > i {
        display: block;
        height: 100%;
        background: var(--proto-accent);
      }
      .meterRow .meter > i.danger {
        background: var(--proto-danger);
      }
      .meterRow .mmeta {
        color: var(--proto-muted);
        font-size: 11.5px;
        white-space: nowrap;
      }

      /* ---------- variant C: tight + pills ---------- */
      .tight {
        padding: 8px 14px 4px;
      }
      .tight .bigfig {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .tight .bigfig .small {
        font-size: 13px;
        font-weight: 500;
        color: var(--proto-muted);
      }
      .tight .bigfig.danger {
        color: var(--proto-danger);
      }
      .tight .bigsub {
        color: var(--proto-muted);
        font-size: 12px;
        margin-top: 2px;
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 14px 6px;
      }
      .pill {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        border: 1px solid var(--proto-sep);
        border-radius: 999px;
        padding: 2px 9px;
        font-size: 12px;
        white-space: nowrap;
      }
      .pill .pk {
        color: var(--proto-muted);
      }
      .pill .pv {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .pill .pv.danger {
        color: var(--proto-danger);
      }

      /* expander (rolling) */
      details.uroll {
        padding: 0 14px;
      }
      details.uroll > summary {
        list-style: none;
        cursor: pointer;
        color: var(--proto-accent);
        font-size: 12px;
        padding: 4px 0;
      }
      details.uroll > summary::before {
        content: '▸ ';
      }
      details.uroll[open] > summary::before {
        content: '▾ ';
      }

      /* ---------- shared states ---------- */
      .state {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-align: center;
        flex-wrap: wrap;
        padding: 8px 14px;
      }
      .state .title {
        font-weight: 600;
      }
      .state .hint {
        color: var(--proto-muted);
        font-size: 12px;
        width: 100%;
      }
      .state.error .title {
        color: var(--proto-danger);
      }
      .spinner {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid color-mix(in srgb, var(--proto-text) 25%, transparent);
        border-top-color: var(--proto-text);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .code {
        font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
        background: color-mix(in srgb, var(--proto-sep) 70%, transparent);
        border-radius: 4px;
        padding: 1px 5px;
        color: var(--proto-muted);
      }
      .retry {
        font: inherit;
        font-size: 11px;
        color: var(--proto-text);
        background: transparent;
        border: 1px solid var(--proto-ctl-border);
        border-radius: 6px;
        height: 22px;
        padding: 0 8px;
        cursor: pointer;
      }

      /* in-panel selector (faux mountSelect) */
      .inline-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px 0;
      }
      .inline-controls select {
        font: inherit;
        font-size: 12px;
        color: var(--proto-text);
        background: var(--proto-ctl-bg);
        border: 1px solid var(--proto-ctl-border);
        border-radius: 6px;
        height: 24px;
        padding: 0 4px;
        flex: 1;
        min-width: 0;
      }

      /* ---------- height-driven adaptation (container queries) ---------- */
      @container frame (max-height: 170px) {
        .r-rollhead,
        details.uroll {
          display: none;
        }
      }
      @container frame (max-height: 120px) {
        .meterRow .mtrack,
        .tight .bigsub {
          display: none;
        }
      }
      @container frame (max-height: 96px) {
        .r-cap:not(.primary),
        .pill:not(.primary),
        .meterRow:not(.primary) {
          display: none;
        }
      }
      @container frame (max-height: 60px) {
        .r-cap,
        .meterRow,
        .pills {
          display: none;
        }
      }
      @container frame (max-height: 34px) {
        .uhead {
          padding-top: 6px;
          padding-bottom: 6px;
        }
        .tight {
          padding-top: 6px;
        }
        .tight .bigsub {
          display: none;
        }
      }

      /* ---------- prototype chrome (not the design) ---------- */
      .proto-controls {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 50;
        background: #11151c;
        color: #dbe2ee;
        border: 1px solid #2b3341;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 11px;
        width: 216px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .proto-controls h2 {
        margin: 0 0 8px;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8b95a7;
      }
      .proto-controls label {
        display: block;
        margin: 7px 0 2px;
        color: #9aa4b5;
      }
      .proto-controls .val {
        color: #e7eaf0;
        float: right;
        font-variant-numeric: tabular-nums;
      }
      .proto-controls input[type='range'] {
        width: 100%;
        accent-color: #6ea8fe;
      }
      .proto-controls select {
        width: 100%;
        font: inherit;
        color: #e7eaf0;
        background: #0e1219;
        border: 1px solid #2b3341;
        border-radius: 6px;
        height: 24px;
      }
      .seg {
        display: flex;
        gap: 4px;
        margin-top: 2px;
      }
      .seg button {
        flex: 1;
        font: inherit;
        color: #cbd3e0;
        background: #0e1219;
        border: 1px solid #2b3341;
        border-radius: 6px;
        height: 24px;
        cursor: pointer;
      }
      .seg button.on {
        background: #2f6fed;
        border-color: #2f6fed;
        color: #fff;
      }
      .proto-switcher {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 10px;
        background: #11151c;
        color: #f0f3f8;
        border: 1px solid #2b3341;
        border-radius: 999px;
        padding: 6px 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      .proto-switcher button {
        font: inherit;
        font-size: 15px;
        color: #f0f3f8;
        background: transparent;
        border: 0;
        cursor: pointer;
        width: 26px;
        height: 26px;
        border-radius: 50%;
      }
      .proto-switcher button:hover {
        background: #232a36;
      }
      .proto-switcher .label {
        min-width: 190px;
        text-align: center;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body data-theme="light">
    <div class="panel" id="panel">
      <div class="panel-title">Work Status</div>

      <section class="ws-section ws-inert">
        <div class="ws-header">
          <span class="ws-chevron">▸</span>
          <span class="ws-title">Changes</span>
        </div>
        <div class="ws-body">3 files changed · +42 −11</div>
      </section>

      <section class="ws-section" id="target"><!-- rendered --></section>

      <section class="ws-section ws-inert">
        <div class="ws-header">
          <span class="ws-chevron">▸</span>
          <span class="ws-title">Checks</span>
        </div>
        <div class="ws-body">2 passing · 1 running</div>
      </section>
    </div>

    <div class="proto-controls">
      <h2>Prototype controls</h2>
      <label>Theme</label>
      <div class="seg" id="themeSeg">
        <button data-theme="light">Light</button>
        <button data-theme="dark">Dark</button>
      </div>
      <label>Frame height <span class="val" id="heightVal"></span></label>
      <input type="range" id="height" min="24" max="320" step="2" />
      <label>Panel width <span class="val" id="widthVal"></span></label>
      <input type="range" id="width" min="220" max="460" step="2" />
      <label>State</label>
      <select id="state">
        <option value="normal">normal — key + member + team</option>
        <option value="keyonly">key only</option>
        <option value="memberteam">member + team (key unset)</option>
        <option value="exhausted">exhausted (team at $0)</option>
        <option value="soft">soft budget exceeded</option>
        <option value="unlimited">unbudgeted / unlimited</option>
        <option value="degraded">degraded (team lookup + no rolling)</option>
        <option value="loading">loading</option>
        <option value="empty">no provider found</option>
        <option value="error">fatal error</option>
      </select>
      <label>Provider selector surface</label>
      <div class="seg" id="selectorSeg">
        <button data-sel="header">Header</button>
        <button data-sel="inline">In-panel</button>
      </div>
      <label>&nbsp;</label>
      <div class="seg" id="boundsSeg">
        <button data-bounds="on">Bounds on</button>
        <button data-bounds="off">Off</button>
      </div>
    </div>

    <div class="proto-switcher">
      <button id="prev" aria-label="Previous variant">‹</button>
      <span class="label" id="swLabel"></span>
      <button id="next" aria-label="Next variant">›</button>
    </div>

    <script>
      // ---- state ----
      const params = new URLSearchParams(location.search);
      const VARIANTS = [
        { key: 'A', name: 'Ledger' },
        { key: 'B', name: 'Meters' },
        { key: 'C', name: 'Tight' },
      ];
      const $ = (s) => document.querySelector(s);

      let variant = params.get('variant') || 'A';
      let state = params.get('state') || 'normal';
      let height = Number(params.get('height') || 150);
      let width = Number(params.get('width') || 360);
      let selector = params.get('selector') || 'header';
      let bounds = (params.get('bounds') || 'on') === 'on';
      let theme = params.get('theme') || 'light';

      function syncParam(k, v) {
        params.set(k, v);
        try {
          history.replaceState(null, '', '?' + params.toString());
        } catch (_) {}
      }

      // ---- data ----
      const DAY = 864e5;
      const plusDays = (n) => new Date(Date.now() + n * DAY).toISOString();
      function todayAt(h, m) {
        const d = new Date();
        d.setHours(h, m, 0, 0);
        if (d.getTime() < Date.now()) d.setDate(d.getDate() + 1);
        return d.toISOString();
      }

      const KEY = {
        source: 'key',
        duration: '30d',
        cap: 50,
        spend: 12.5,
        remaining: 37.5,
        resetsAt: plusDays(28),
        resetDerived: false,
      };
      const MEMBER = {
        source: 'member',
        duration: '7d',
        cap: 40,
        spend: 30,
        remaining: 10,
        resetsAt: plusDays(4),
        softBudget: { limit: 35, exceeded: false },
      };
      const TEAM = {
        source: 'team',
        duration: '30d',
        cap: 200,
        spend: 12.5,
        remaining: 187.5,
        resetsAt: plusDays(28),
        resetDerived: false,
      };

      const PROVIDER = { id: 'litellm', name: 'LiteLLM', host: 'https://proxy.example.com' };

      function data(s) {
        const cap = (over) => ({ ...over });
        switch (s) {
          case 'loading':
            return { loading: true };
          case 'empty':
            return { empty: true };
          case 'error':
            return {
              error: { code: 'provider_unreachable', message: 'proxy.example.com did not respond' },
            };
          case 'keyonly':
            return {
              provider: PROVIDER,
              asOf: new Date().toISOString(),
              headline: { kind: 'remaining', remaining: 37.5, source: 'key', exhausted: false },
              caps: [cap(KEY)],
              rolling: { day: 1.2, week: 8.4, month: 21.0 },
            };
          case 'memberteam':
            return {
              provider: PROVIDER,
              asOf: new Date().toISOString(),
              headline: { kind: 'remaining', remaining: 10, source: 'member', exhausted: false },
              caps: [cap(MEMBER), cap(TEAM)],
              rolling: { day: 1.2, week: 8.4, month: 21.0 },
            };
          case 'exhausted':
            return {
              provider: PROVIDER,
              asOf: new Date().toISOString(),
              headline: { kind: 'remaining', remaining: 0, source: 'team', exhausted: true },
              caps: [
                cap(KEY),
                cap(MEMBER),
                cap({ ...TEAM, spend: 200, remaining: 0 }),
              ],
              rolling: { day: 12.0, week: 48.4, month: 201.0 },
            };
          case 'soft':
            return {
              provider: PROVIDER,
              asOf: new Date().toISOString(),
              headline: { kind: 'remaining', remaining: 10, source: 'member', exhausted: false },
              caps: [cap(KEY), cap({ ...MEMBER, softBudget: { limit: 25, exceeded: true } }), cap(TEAM)],
              rolling: { day: 1.2, week: 8.4, month: 21.0 },
            };
          case 'unlimited':
            return {
              provider: PROVIDER,
              asOf: new Date().toISOString(),
              headline: { kind: 'unlimited' },
              caps: [],
              rolling: { day: 1.2, week: 8.4, month: 21.0 },
            };
          case 'degraded':
            return {
              provider: PROVIDER,
              asOf: new Date().toISOString(),
              headline: { kind: 'unlimited' },
              caps: [],
              degraded: [{ figure: 'team', code: 'team_lookup_failed', message: 'team lookup failed' }],
            };
          default:
            return {
              provider: PROVIDER,
              asOf: new Date().toISOString(),
              headline: { kind: 'remaining', remaining: 10, source: 'member', exhausted: false },
              caps: [cap(KEY), cap(MEMBER), cap(TEAM)],
              rolling: { day: 1.2, week: 8.4, month: 21.0 },
            };
        }
      }

      const usd = (n) => {
        const abs = Math.abs(n);
        const d = abs > 0 && abs < 1 ? 4 : 2;
        return (
          '$' +
          n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d })
        );
      };
      const capLabel = (c) => ({ key: 'Key balance', member: 'Member balance', team: 'Team balance' }[c.source]);
      const pct = (c) => (c.cap ? Math.min(100, (c.spend / c.cap) * 100) : 0);

      function fmtReset(iso) {
        const d = new Date(iso);
        const now = new Date();
        const time = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
        if (d.toDateString() === now.toDateString()) return time;
        return (
          d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ', ' + time
        );
      }

      const ICON = `<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="7" y="12" width="3" height="6" fill="currentColor"/><rect x="12" y="7" width="3" height="11" fill="currentColor"/><rect x="17" y="14" width="3" height="4" fill="currentColor"/></svg>`;

      const headlineText = (d) =>
        d.headline.kind === 'unlimited' ? 'Unlimited' : `${usd(d.headline.remaining)} left`;

      function providerHead(d, extra) {
        const danger = d.headline.kind === 'remaining' && d.headline.exhausted;
        return `<div class="uhead">
            <span class="uicon">${ICON}</span>
            <span class="uname">${d.provider.name}</span>
            ${extra || ''}
            <span class="uhead-val ${danger ? 'danger' : ''}">${headlineText(d)}</span>
          </div>`;
      }

      function rollingBlock(d, expander) {
        if (d.rolling) {
          const inner = [
            ['Today', d.rolling.day],
            ['Last 7 days', d.rolling.week],
            ['Last 30 days', d.rolling.month],
          ]
            .map(
              ([l, v]) =>
                `<div class="urow"><span class="ulabel">${l}</span><span class="uval">${usd(v)}</span></div>`,
            )
            .join('');
          if (expander)
            return `<details class="uroll"><summary>Rolling spend</summary>${inner}</details>`;
          return `<div class="usublabel r-rollhead">Rolling spend</div>${inner}`;
        }
        if (d.degraded)
          return `<div class="usublabel r-rollhead">rolling unavailable</div>`;
        return '';
      }

      const softDot = (c) => (c.softBudget && c.softBudget.exceeded ? '<span class="dot"></span>' : '');

      // ---- variant A: ledger (flat rows) ----
      function figLedger(d) {
        const rows = d.caps
          .map(
            (c, i) => `<div class="urow r-cap${i === 0 ? ' primary' : ''}">
              <span class="ulabel">${capLabel(c)}</span>
              <span class="umeta">${c.duration || ''}${c.resetsAt ? ' · ' + fmtReset(c.resetsAt) : ''}</span>
              <span class="uval ${c.exhausted || c.remaining <= 0 ? 'danger' : ''}">${usd(c.spend)} / ${usd(c.cap)}${softDot(c)}</span>
            </div>`,
          )
          .join('');
        return `<div>${providerHead(d)}<div class="urows">${rows}</div>${rollingBlock(d, true)}</div>`;
      }

      // ---- variant B: meters ----
      function figMeters(d) {
        const rows = d.caps
          .map(
            (c, i) => `<div class="meterRow r-cap${i === 0 ? ' primary' : ''}">
              <div class="mtop">
                <span class="ulabel">${capLabel(c)}</span>
                <span class="uval ${c.exhausted || c.remaining <= 0 ? 'danger' : ''}">${usd(c.remaining)} <span class="muted" style="font-weight:400">left</span>${softDot(c)}</span>
              </div>
              <div class="mtrack">
                <span class="meter"><i class="${c.exhausted || c.remaining <= 0 ? 'danger' : ''}" style="width:${pct(c)}%"></i></span>
                <span class="mmeta">${usd(c.spend)} / ${usd(c.cap)}${c.resetsAt ? ' · ' + fmtReset(c.resetsAt) : ''}</span>
              </div>
            </div>`,
          )
          .join('');
        return `<div>${providerHead(d)}${rows}${rollingBlock(d, true)}</div>`;
      }

      // ---- variant C: tight + pills ----
      function figTight(d) {
        const unlimited = d.headline.kind === 'unlimited';
        const h = d.headline;
        const headCap = d.caps.find((c) => c.source === h.source) || d.caps[0];
        const danger = !unlimited && h.exhausted;
        const others = d.caps.filter((c) => c !== headCap);
        const pills = others
          .map(
            (c, i) => `<span class="pill${i === 0 ? ' primary' : ''}">
              <span class="pk">${capLabel(c).replace(' balance', '')}</span>
              <span class="pv ${c.exhausted || c.remaining <= 0 ? 'danger' : ''}">${usd(c.remaining)} left</span>
            </span>`,
          )
          .join('');
        const big = unlimited
          ? `<div class="bigfig">Unlimited</div><div class="bigsub">no key, member or team cap</div>`
          : `<div class="bigfig ${danger ? 'danger' : ''}">${usd(h.remaining)} <span class="small">left</span></div>
             <div class="bigsub">${headCap ? capLabel(headCap) : 'headline'}${headCap && headCap.resetsAt ? ' · resets ' + fmtReset(headCap.resetsAt) : ''}</div>`;
        return `<div>${providerHead(d)}
            <div class="tight">${big}</div>
            ${pills ? `<div class="pills">${pills}</div>` : ''}
            ${rollingBlock(d, true)}
          </div>`;
      }

      const FIGURES = { A: figLedger, B: figMeters, C: figTight };

      function stateHTML(kind, d) {
        if (kind === 'loading')
          return `<div class="state"><span class="spinner"></span><span class="title">Loading LiteLLM usage…</span></div>`;
        if (kind === 'empty')
          return `<div class="state"><span class="title">No LiteLLM provider found</span><span class="hint">Add one to your OpenCode provider config.</span></div>`;
        if (kind === 'error')
          return `<div class="state error"><span class="title">${d.error.message}</span><span class="code">${d.error.code}</span><span class="hint"><button class="retry">Retry</button></span></div>`;
        return '';
      }

      function renderVariant(d) {
        if (d.loading) return stateHTML('loading');
        if (d.empty) return stateHTML('empty');
        if (d.error) return stateHTML('error', d);
        return FIGURES[variant](d);
      }

      // ---- selector surfaces ----
      const PROVIDERS = [
        { id: 'litellm', host: 'proxy.example.com' },
        { id: 'litellm-dev', host: 'dev.example.com' },
      ];
      const optionsHTML = () =>
        PROVIDERS.map((p) => `<option value="${p.id}">${p.id} · ${p.host}</option>`).join('');
      const headerControls = () =>
        `<select class="hdr-select">${optionsHTML()}</select><button class="hdr-btn" title="Refresh">⟳</button>`;
      const inlineControls = () =>
        `<div class="inline-controls"><select>${optionsHTML()}</select><button class="hdr-btn" title="Refresh">⟳</button></div>`;

      // ---- render ----
      function render() {
        document.body.dataset.theme = theme;
        document.documentElement.dataset.theme = theme;
        $('#panel').style.width = width + 'px';

        const d = data(state);
        $('#target').innerHTML = `
          <div class="ws-header">
            <span class="ws-chevron">▾</span>
            <span class="ws-title">LiteLLM Usage</span>
            <span class="ws-actions">${selector === 'header' ? headerControls() : ''}</span>
          </div>
          <div class="frame ${bounds ? 'bounds' : ''}" style="height:${height}px">
            ${selector === 'inline' ? inlineControls() : ''}
            <div class="frame-body">${renderVariant(d)}</div>
          </div>`;

        $('#height').value = height;
        $('#width').value = width;
        $('#state').value = state;
        $('#heightVal').textContent = height + ' px';
        $('#widthVal').textContent = width + ' px';
        for (const b of $('#selectorSeg').children) b.classList.toggle('on', b.dataset.sel === selector);
        for (const b of $('#themeSeg').children) b.classList.toggle('on', b.dataset.theme === theme);
        for (const b of $('#boundsSeg').children) b.classList.toggle('on', (b.dataset.bounds === 'on') === bounds);

        const v = VARIANTS.find((x) => x.key === variant) || VARIANTS[0];
        $('#swLabel').textContent = `${v.key} — ${v.name}  (${height}px)`;

        const det = document.querySelector('details.uroll');
        if (det)
          det.addEventListener('toggle', () => {
            height = Math.max(24, Math.min(320, height + (det.open ? 84 : -84)));
            syncParam('height', height);
            render();
          });

        try {
          history.replaceState(null, '', '?' + params.toString());
        } catch (_) {}
      }

      function showVariant(key) {
        variant = key;
        syncParam('variant', key);
        render();
      }
      const step = (dir) => {
        const i = VARIANTS.findIndex((x) => x.key === variant);
        showVariant(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key);
      };

      // ---- controls ----
      $('#height').addEventListener('input', (e) => {
        height = Number(e.target.value);
        syncParam('height', height);
        render();
      });
      $('#width').addEventListener('input', (e) => {
        width = Number(e.target.value);
        syncParam('width', width);
        render();
      });
      $('#state').addEventListener('change', (e) => {
        state = e.target.value;
        syncParam('state', state);
        render();
      });
      $('#selectorSeg').addEventListener('click', (e) => {
        if (!e.target.dataset.sel) return;
        selector = e.target.dataset.sel;
        syncParam('selector', selector);
        render();
      });
      $('#themeSeg').addEventListener('click', (e) => {
        if (!e.target.dataset.theme) return;
        theme = e.target.dataset.theme;
        syncParam('theme', theme);
        render();
      });
      $('#boundsSeg').addEventListener('click', (e) => {
        if (!e.target.dataset.bounds) return;
        bounds = e.target.dataset.bounds === 'on';
        syncParam('bounds', bounds ? 'on' : 'off');
        render();
      });
      $('#prev').addEventListener('click', () => step(-1));
      $('#next').addEventListener('click', () => step(1));
      document.addEventListener('keydown', (e) => {
        const tag = (document.activeElement && document.activeElement.tagName) || '';
        if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
        if (e.key === 'ArrowLeft') step(-1);
        if (e.key === 'ArrowRight') step(1);
      });

      render();
    </script>
  </body>
</html>
